<p-toast />
<p-confirmdialog [style]="{ width: '450px' }" />

<div class="flex flex-col bg-surface-0 dark:bg-surface-900 rounded-2xl border border-surface-200 dark:border-surface-700 overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h1 class="text-surface-950 dark:text-surface-0 text-lg font-medium leading-7">Produits</h1>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full sm:w-auto">
            <p-iconfield class="w-full sm:w-[220px]">
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText [(ngModel)]="searchValue" (input)="onGlobalFilter(dt, $event)" placeholder="Rechercher..." class="w-full! py-2! rounded-xl!" />
            </p-iconfield>

            <p-select
                [options]="typeOptions"
                [(ngModel)]="filterType"
                optionLabel="label"
                optionValue="value"
                (onChange)="onFilterChange()"
                placeholder="Type"
                class="w-full sm:w-44"
                appendTo="body"
            />

            <p-select
                [options]="statutOptions"
                [(ngModel)]="filterStatut"
                optionLabel="label"
                optionValue="value"
                (onChange)="onFilterChange()"
                placeholder="Statut"
                class="w-full sm:w-44"
                appendTo="body"
            />

            <p-button
                icon="pi pi-plus"
                label="Nouveau produit"
                severity="primary"
                [rounded]="true"
                class="w-full sm:w-auto cursor-pointer"
                routerLink="/produits/new"
            />
        </div>
    </div>

    <!-- Table -->
    <div class="flex-1 px-6 py-5">
        <p-table
            #dt
            [value]="produits()"
            [loading]="loading()"
            [paginator]="true"
            [rows]="rows"
            [first]="first"
            sortMode="multiple"
            [tableStyle]="{ width: '100%' }"
            paginatorTemplate="FirstPageLink PrevPageLink PageLinks NextPageLink LastPageLink CurrentPageReport"
            currentPageReportTemplate="Affiche {first} à {last} sur {totalRecords} résultats"
            [globalFilterFields]="['nom', 'code_interne', 'code_fournisseur', 'type', 'statut']"
            class="overflow-hidden"
            [pt]="{ pcPaginator: { root: { class: 'rounded-none!' } } }"
        >
            <ng-template #header>
                <tr>
                    <th pSortableColumn="nom">
                        <span class="flex items-center gap-2">Nom <p-sortIcon field="nom" /></span>
                    </th>
                    <th>Code / Réf.</th>
                    <th pSortableColumn="type">
                        <span class="flex items-center gap-2">Type <p-sortIcon field="type" /></span>
                    </th>
                    <th pSortableColumn="statut">
                        <span class="flex items-center gap-2">Statut <p-sortIcon field="statut" /></span>
                    </th>
                    <th pSortableColumn="qte_stock">
                        <span class="flex items-center gap-2">Stock <p-sortIcon field="qte_stock" /></span>
                    </th>
                    <th pSortableColumn="prix_vente">
                        <span class="flex items-center gap-2">Prix vente <p-sortIcon field="prix_vente" /></span>
                    </th>
                    <th style="width: 5rem">Actions</th>
                </tr>
            </ng-template>

            <ng-template #body let-produit>
                <tr>
                    <td>
                        <div class="flex flex-col">
                            <span class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ produit.nom }}</span>
                            <span *ngIf="produit.description" class="text-surface-400 text-xs truncate max-w-[200px]">{{ produit.description }}</span>
                        </div>
                    </td>
                    <td>
                        <div class="flex flex-col gap-0.5">
                            <code *ngIf="produit.code_interne" class="text-xs bg-surface-100 dark:bg-surface-700 px-1.5 py-0.5 rounded text-surface-700 dark:text-surface-200">{{ produit.code_interne }}</code>
                            <span *ngIf="produit.code_fournisseur" class="text-xs text-surface-400">{{ produit.code_fournisseur }}</span>
                            <span *ngIf="!produit.code_interne && !produit.code_fournisseur" class="text-surface-400 text-sm">—</span>
                        </div>
                    </td>
                    <td>
                        <p-tag [value]="getTypeLabel(produit.type)" [severity]="getTypeSeverity(produit.type)" />
                    </td>
                    <td>
                        <p-tag [value]="getStatutLabel(produit.statut)" [severity]="getStatutSeverity(produit.statut)" />
                    </td>
                    <td>
                        <span *ngIf="produit.type === 'service'" class="text-surface-400 text-sm">∞</span>
                        <span
                            *ngIf="produit.type !== 'service'"
                            [class.text-red-500]="produit.is_out_of_stock"
                            [class.font-semibold]="produit.is_out_of_stock"
                            [class.text-orange-500]="produit.is_low_stock && !produit.is_out_of_stock"
                            class="text-sm"
                        >
                            {{ produit.qte_stock }}
                            <span *ngIf="produit.is_out_of_stock" class="text-xs ml-1">(rupture)</span>
                            <span *ngIf="produit.is_low_stock && !produit.is_out_of_stock" class="text-xs ml-1">(faible)</span>
                        </span>
                    </td>
                    <td>
                        <span class="text-sm text-surface-700 dark:text-surface-200">{{ formatPrice(produit.prix_vente) }}</span>
                    </td>
                    <td>
                        <p-button
                            (onClick)="toggleMenu($event, produit.id)"
                            [rounded]="true"
                            [text]="true"
                            icon="pi pi-ellipsis-h"
                            size="small"
                            severity="secondary"
                            class="cursor-pointer"
                        />
                    </td>
                </tr>
            </ng-template>

            <ng-template #empty>
                <tr>
                    <td colspan="7" class="text-center py-10 text-surface-400">
                        <i class="pi pi-inbox text-3xl mb-2 block"></i>
                        Aucun produit trouvé.
                    </td>
                </tr>
            </ng-template>
        </p-table>

        <p-menu #actionMenu [model]="menuItems()" [popup]="true" styleClass="w-52!" appendTo="body" />
    </div>
</div>
