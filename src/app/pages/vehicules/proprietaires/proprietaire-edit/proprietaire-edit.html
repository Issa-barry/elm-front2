@if (loading()) {
  <div class="card p-8 flex items-center justify-center gap-3 text-surface-400">
    <i class="pi pi-spin pi-spinner text-2xl"></i>
    <span>Chargement du proprietaire...</span>
  </div>
} @else if (notFound()) {
  <div class="card p-8 text-center">
    <i class="pi pi-exclamation-circle text-4xl text-orange-400 mb-4 block"></i>
    <p class="text-surface-600 dark:text-surface-300 text-lg mb-4">Proprietaire introuvable.</p>
    <a class="text-primary cursor-pointer font-medium" routerLink="/vehicules/proprietaires">
      Retour a la liste
    </a>
  </div>
} @else if (proprietaire()) {
  <app-proprietaire-form [proprietaire]="proprietaire()!" />
}
